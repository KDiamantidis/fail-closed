[project]
name = "fail-closed"
version = "0.1.0"
description = "Signing Guard: an independent co-signer that checks a signing request before the signer signs."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "docker>=7.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "policies"]
py-modules = ["state_provider", "sandbox_runner", "llm", "cli", "decode", "history", "guard", "breaker", "scenario", "approval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: needs a running Docker daemon and the sandbox image (skipped otherwise)",
]
