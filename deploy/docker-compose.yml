# Caddy only, on the system Docker daemon. No docker.sock, no host paths except its own config.
# Host networking: it reaches the API on 127.0.0.1:8000 and publishes no Docker ports
# (so Docker never opens the firewall behind ufw's back).
services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
volumes:
  caddy_data:
  caddy_config:
